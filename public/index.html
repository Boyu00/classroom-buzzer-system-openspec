<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>課堂搶答系統</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <p class="eyebrow">課堂活動 · OpenSpec</p>
    <h1>課堂搶答系統</h1>
    <p class="intro">讓各組的答案，在同一個課堂裡即時匯集。</p>
    <section aria-labelledby="progress-title">
      <span class="badge">建置中</span>
      <h2 id="progress-title">學生操作頁已就緒</h2>
      <p>學生可使用加入碼與組名參與活動，等待老師開啟後作答。</p>
      <p><a href="/student.html">前往學生搶答頁</a></p>
      <p>教師操作頁與 Google Sheets 串接仍待整合。</p>
      <p id="connection-status" role="status" aria-live="polite">正在確認活動連線。</p>
      <p id="activity-status"></p>
      <a href="/api/health">查看服務狀態</a>
    </section>
  </main>
  <script type="module" src="/status.js"></script>
</body>
</html>
